<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hlzr</title>
    <style>
        /* Reset default browser spacing */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: white;
        }

        /* The container setup */
        body {
            display: flex;
            justify-content: center; /* Horizontally center */
            align-items: center;     /* Vertically center */
        }

        /* The image styling */
        img {
            display: block;
            height: auto; /* Maintains aspect ratio */
            
            /* MOBILE BEHAVIOR:
               This ensures the image takes up the full width of the screen */
            width: 100%;

            /* DESKTOP BEHAVIOR:
               This stops the image from getting too huge on big monitors. 
               It will stop growing once it hits 800px (or the image's native size).
               You can remove this line if you want it full-width on desktop too. */
            max-width: 800px; 
        }
    </style>
</head>
<body>

    <img src="logo.svg" alt="logo.svg">

</body>
</html>
